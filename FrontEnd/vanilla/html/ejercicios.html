<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MeloFit App</title>
    <link href="https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@400;600;700&family=Inter:wght@700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #3d5afe; /* Azul eléctrico moderno */
            --secondary: #8c9eff;
            --bg: #050505;
            --surface: #121212;
            --card-bg: rgba(255, 255, 255, 0.05);
            --text-main: #ffffff;
            --text-dim: #a0a0a0;
            --safe-area-bottom: 80px;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'SF Pro Display', 'Inter', sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Header Estilo iOS */
        header {
            padding: 40px 20px 20px;
            background: linear-gradient(to bottom, rgba(61, 90, 254, 0.15), transparent);
        }

        header h1 {
            font-size: 28px;
            margin: 0;
            font-weight: 900;
            letter-spacing: -1px;
        }

        header p {
            color: var(--text-dim);
            margin: 5px 0 0;
            font-size: 14px;
        }

        /* Contenedor de la rutina */
        .app-content {
            padding: 0 20px var(--safe-area-bottom);
            flex: 1;
        }

        .current-day-label {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .current-day-label h2 {
            font-size: 22px;
            margin: 0;
        }

        .current-day-label span {
            background: var(--primary);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            text-transform: uppercase;
        }

        /* Lista de ejercicios estilo App */
        .exercise-card {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 18px;
            padding: 20px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: transform 0.2s ease;
        }

        .exercise-card:active {
            transform: scale(0.98);
        }

        .exercise-card.completed {
            border-color: var(--primary);
            opacity: 0.6;
        }

        .exercise-info b {
            display: block;
            font-size: 17px;
            margin-bottom: 4px;
        }

        .exercise-info span {
            color: var(--text-dim);
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        /* Botón de Check */
        .check-circle {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            border: 2px solid var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.3s;
        }

        .completed .check-circle {
            background: var(--primary);
        }

        .completed .check-circle::after {
            content: '✓';
            color: white;
            font-weight: bold;
        }

        /* Bottom Navigation Bar */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            width: 100%;
            background: rgba(18, 18, 18, 0.8);
            backdrop-filter: blur(20px);
            border-top: 1px solid rgba(255,255,255,0.1);
            display: flex;
            justify-content: space-around;
            padding: 12px 0 25px; /* Padding extra para el notch de abajo */
            z-index: 100;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: var(--text-dim);
            text-decoration: none;
            font-size: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }

        .nav-item.active {
            color: var(--primary);
        }

        .nav-icon {
            font-size: 20px;
            margin-bottom: 4px;
        }

    </style>
</head>
<body>

    <header>
        <h1>Mi Rutina</h1>
        <p>Potenciado por Gemini • S25 Ultra Edition</p>
    </header>

    <main class="app-content">
        <div class="current-day-label">
            <h2 id="dayTitle">Lunes</h2>
            <span id="focusTag">Máquinas</span>
        </div>

        <div id="exerciseList">
            </div>
    </main>

    <nav class="bottom-nav">
        <div class="nav-item active" onclick="updateView('Lunes', this)">
            <span class="nav-icon">L</span>
            <span>LUN</span>
        </div>
        <div class="nav-item" onclick="updateView('Martes', this)">
            <span class="nav-icon">M</span>
            <span>MAR</span>
        </div>
        <div class="nav-item" onclick="updateView('Miercoles', this)">
            <span class="nav-icon">M</span>
            <span>MIE</span>
        </div>
        <div class="nav-item" onclick="updateView('Jueves', this)">
            <span class="nav-icon">J</span>
            <span>JUE</span>
        </div>
        <div class="nav-item" onclick="updateView('Viernes', this)">
            <span class="nav-icon">V</span>
            <span>VIE</span>
        </div>
    </nav>

    <script>
        const routines = {
            'Lunes': { focus: 'Superior (Empuje)', ex: [
                {n: 'Press Pecho Máquina', s: '4 x 12'},
                {n: 'Jalón Polea Alta', s: '4 x 12'},
                {n: 'Press Hombro Máquina', s: '3 x 12'},
                {n: 'Bíceps/Tríceps Polea', s: '3 x 15'},
                {n: 'Crunch Máquina', s: '3 x 15'}
            ]},
            'Martes': { focus: 'Pierna (Cuádriceps)', ex: [
                {n: 'Prensa 45°', s: '4 x 12'},
                {n: 'Extensión Cuádriceps', s: '4 x 15'},
                {n: 'Curl Femoral Sentado', s: '3 x 12'},
                {n: 'Máquina Glúteo', s: '4 x 12'},
                {n: 'Prensa Pantorrilla', s: '4 x 20'}
            ]},
            'Miercoles': { focus: 'Full Body', ex: [
                {n: 'Prensa Horizontal', s: '3 x 15'},
                {n: 'Peck Deck', s: '3 x 12'},
                {n: 'Remo Bajo Máquina', s: '3 x 12'},
                {n: 'Elevaciones Polea', s: '3 x 15'},
                {n: 'Leñador Polea', s: '3 x 15'}
            ]},
            'Jueves': { focus: 'Superior (Tracción)', ex: [
                {n: 'Press Inclinado Smith', s: '4 x 10'},
                {n: 'Remo Convergente', s: '4 x 12'},
                {n: 'Face Pulls Polea', s: '3 x 15'},
                {n: 'Predicador Máquina', s: '3 x 12'},
                {n: 'Fondos Asistidos', s: '3 x 12'}
            ]},
            'Viernes': { focus: 'Pierna (Posterior)', ex: [
                {n: 'Curl Femoral Acostado', s: '4 x 12'},
                {n: 'Abducción Máquina', s: '4 x 15'},
                {n: 'Prensa Unilateral', s: '3 x 12'},
                {n: 'Hiperextensiones', s: '3 x 15'},
                {n: 'Costurero Pantorrilla', s: '4 x 15'}
            ]}
        };

        function updateView(day, element) {
            // Animación de botones
            document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
            element.classList.add('active');

            // Actualizar datos
            document.getElementById('dayTitle').innerText = day;
            document.getElementById('focusTag').innerText = routines[day].focus;

            const list = document.getElementById('exerciseList');
            list.innerHTML = '';

            routines[day].ex.forEach(item => {
                const div = document.createElement('div');
                div.className = 'exercise-card';
                div.onclick = function() { this.classList.toggle('completed'); };
                div.innerHTML = `
                    <div class="exercise-info">
                        <b>${item.n}</b>
                        <span>🕒 ${item.s}</span>
                    </div>
                    <div class="check-circle"></div>
                `;
                list.appendChild(div);
            });
        }

        // Carga inicial
        updateView('Lunes', document.querySelector('.nav-item'));
    </script>
</body>
</html>
