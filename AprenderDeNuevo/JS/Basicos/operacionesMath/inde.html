<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Operaciones Matematicas clasicas</title>
</head>
<body class="cuerpo">

    <h1 class="titulo titulo-General">Operaciones Matematicas clasicas</h1>

    <div class="contenedor-principal">
        <div class="contenedor-suma">
            <h2 class="titulo titulo-suma">Suma</h2>
            <form class="formulario">
                <label for="sumaUno" class="label">Numero 1</label>
                <input type="number" id="sumaUno" class="input" placeholder="Ingrese el primer numero">
                <label for="sumaDos" class="label">Numero 2</label>
                <input type="number" id="sumaDos" class="input" placeholder="Ingrese el segundo numero">                   
            </form>
        </div>

        <div class="contenedor-resta">
            <h2 class="titulo titulo-resta">Resta</h2>
            <form class="formulario">
                <label for="restaUno" class="label">Numero 1</label>
                <input type="number" id="restaUno" class="input" placeholder="Ingrese el primer numero">
                <label for="restaDos" class="label">Numero 2</label>
                <input type="number" id="restaDos" class="input" placeholder="Ingrese el segundo numero">                   
            </form>
        </div>

        <div class="contenedor-multiplicacion">
            <h2 class="titulo titulo-multiplicacion">Multiplicación</h2>
            <form class="formulario">
                <label for="multiUno" class="label">Numero 1</label>
                <input type="number" id="multiUno" class="input" placeholder="Ingrese el primer numero">
                <label for="multiDos" class="label">Numero 2</label>
                <input type="number" id="multiDos" class="input" placeholder="Ingrese el segundo numero">                   
            </form>
        </div>

        <div class="contenedor-division">
            <h2 class="titulo titulo-division">División</h2>
            <form class="formulario">
                <label for="divUno" class="label">Numero 1</label>
                <input type="number" id="divUno" class="input" placeholder="Ingrese el primer numero">
                <label for="divDos" class="label">Numero 2</label>
                <input type="number" id="divDos" class="input" placeholder="Ingrese el segundo numero">                   
            </form>
        </div>
    </div>

</body>
</html>
